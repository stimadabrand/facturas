<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Privacidad: la página no puede conectarse a ningún sitio ni enviar formularios. Todo pasa en el navegador. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Factura para Stimada</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="estilo.css?v=4">
</head>
<body>
<main>
  <div class="cabecera">
    <p class="tag">Stimada</p>
    <div class="idiomas" role="group" aria-label="Idioma / Language">
      <button type="button" class="idioma" data-lang="es">ES</button>
      <button type="button" class="idioma" data-lang="en">EN</button>
    </div>
  </div>
  <div>
    <h1 data-t="titulo"></h1>
    <p class="muted"><span data-t="introA"></span><a href="mailto:finance@stimada.com">finance@stimada.com</a><span data-t="introB"></span></p>
  </div>

  <p class="msg err" id="sinDatos" data-t="sinDatos" hidden></p>

  <section class="card" id="resumen" hidden>
    <h2 data-t="resumen"></h2>
    <table id="tabla" class="marcas"></table>
    <div class="negro"><table id="totales"></table></div>
    <p class="muted small"><span data-t="dudaA"></span><a href="mailto:finance@stimada.com">finance@stimada.com</a><span data-t="dudaB"></span></p>
  </section>

  <form class="card" id="form" hidden novalidate>
    <h2 data-t="tusDatos"></h2>
    <div class="grid">
      <label class="wide"><span data-t="nombre"></span><input type="text" id="nombre" autocomplete="name"></label>
      <label><span data-t="nif"></span><input type="text" id="nif"></label>
      <label><span data-t="email"></span><input type="email" id="email" autocomplete="email"></label>
      <label class="wide"><span data-t="direccion"></span><input type="text" id="direccion" autocomplete="street-address"></label>
      <label><span data-t="numero"></span><input type="text" id="numero"></label>
      <label><span data-t="fecha"></span><input type="date" id="fecha"></label>
      <label class="wide"><span data-t="pago"></span><input type="text" id="pago"></label>
    </div>

    <label class="check"><input type="checkbox" id="otro"> <span data-t="otro"></span></label>
    <div class="grid" id="impuestos" hidden>
      <label><span data-t="iva"></span><input type="text" id="iva" inputmode="decimal"></label>
      <label><span data-t="ret"></span><input type="text" id="ret" inputmode="decimal"></label>
      <label class="wide"><span data-t="mencion"></span><textarea id="mencion" rows="2"></textarea></label>
    </div>

    <button type="submit" data-t="boton"></button>
    <p class="msg" id="msg" role="status"></p>
    <p class="muted small" data-t="privacidad"></p>
  </form>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
